services:
  redis:
    image: redis:7-alpine
    container_name: gradient-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - "redis-cli -a \"$${REDIS_PASSWORD}\" ping 2>/dev/null | grep -q PONG"
      interval: 10s
      timeout: 5s
      retries: 5
